<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTSK E-Sınav Denemesi — Sınav 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#000000; --pink-d:#333333; --pink-l:#f5f5f5;
    --ink:#08090a; --muted:#6a6f76; --line:#ececec;
    --ok:#0a7f3f; --ok-l:#effaf3; --bad:#c72c2c; --bad-l:#fdf1f1;
    --warn:#8a6d00; --warn-l:#fbf8ec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fafafa;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
  header{left:var(--pk-yan,248px);background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line);
    padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .logo{font-weight:600;color:#000;letter-spacing:-.01em;font-size:16px}
  .logo span{background:#000;color:#fff;padding:2px 6px;border-radius:5px;margin-left:2px}
  .h-title{color:#000;font-weight:600;letter-spacing:-.01em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
  .h-meta{margin-left:auto;display:flex;align-items:center;gap:12px}
  .timer-label{color:#666;font-size:13px}
  .timer-group{display:flex;align-items:center;gap:6px}
  .timer{font-family:'Geist Mono',monospace;font-weight:500;font-size:13px;line-height:18px;background:#fff;color:#000;border:1px solid var(--line);border-radius:999px;padding:5px 11px;min-width:64px;text-align:center}
  .timer.low{border-color:var(--bad);color:var(--bad)}
  .finish-btn{background:#000;color:#fff;border:1px solid #000;border-radius:999px;padding:5px 16px;font-weight:500;font-size:13px;line-height:18px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .finish-btn:hover{background:#333;border-color:#333}
  .exit-btn{background:#fff;border:1px solid var(--line);color:#000;border-radius:999px;padding:5px 16px;font-weight:500;font-size:13px;line-height:18px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .exit-btn:hover{border-color:#000}

  .wrap{max-width:1080px;margin:18px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .qhead{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:#fff}
  .qno{color:#000;font-weight:600;font-size:19px;letter-spacing:-.02em}
  .qsec{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.03em;color:#000;background:#f5f5f5;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:500}
  .qprog{margin-left:auto;color:var(--muted);font-size:13px}

  .qbody{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:820px){.qbody{grid-template-columns:1fr}.qleft{border-right:none;border-bottom:1px solid var(--line)}}
  .qleft{padding:22px;border-right:1px solid var(--line)}
  .qright{padding:22px;display:flex;flex-direction:column;gap:12px;justify-content:center}
  .qtext{font-size:16px;line-height:1.6;white-space:pre-wrap;color:#111}
  .media{margin-top:16px}
  .media img,.media video{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block}
  .media-fallback{background:var(--warn-l);border:1px dashed #e0b070;color:#7a5200;border-radius:10px;padding:12px 14px;font-size:14px;margin-top:8px}
  .media-fallback .ph{display:block;margin-top:6px;color:#a06a00;font-size:12px;font-style:italic}

  .opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:14px 16px;cursor:pointer;font-size:15px;transition:.12s;user-select:none}
  .opt:hover{border-color:#000}
  .opt .lbl{font-weight:600;color:#000;font-family:'Geist Mono',monospace}
  .opt.sel{background:#000;color:#fff;border-color:#000}
  .opt.sel .lbl{color:#fff}
  .opt.has-img{flex-direction:column;align-items:stretch}
  .opt-img{max-height:130px;width:auto;max-width:100%;border-radius:8px;margin-top:8px;object-fit:contain;background:#fff;align-self:center}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opts-2x2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px}
  @media(max-width:360px){.opts-2x2{grid-template-columns:1fr}}
  /* review states */
  .opt.correct{background:var(--ok-l);border-color:var(--ok)}
  .opt.correct .lbl{color:var(--ok)}
  .opt.wrong{background:var(--bad-l);border-color:var(--bad)}
  .opt.wrong .lbl{color:var(--bad)}
  .review .opt{cursor:default}
  .tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;text-align:center}
  .tag.ok{background:var(--ok);color:#fff}
  .tag.no{background:var(--bad);color:#fff}
  .note{margin-top:4px;background:var(--warn-l);border-left:3px solid var(--warn);color:#7a5200;padding:8px 12px;border-radius:6px;font-size:13px}

  .footer{display:flex;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .nav-btn{background:#fff;border:1px solid var(--line);color:#000;border-radius:999px;padding:10px 18px;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit}
  .nav-btn:hover{border-color:#000}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .nav-btn.next{background:#000;color:#fff;border-color:#000}
  .nav-btn.next:hover{background:#333;border-color:#333}
  .spacer{flex:1}

  .grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .cell{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#666;font-weight:500;cursor:pointer;font-size:13px;font-family:'Geist Mono',monospace;transition:.12s}
  .cell:hover{border-color:#000;color:#000}
  .cell.answered{background:#000;color:#fff;border-color:#000}
  .cell.current{outline:2px solid #000;outline-offset:2px}
  .cell.c-correct{background:var(--ok);color:#fff;border-color:var(--ok)}
  .cell.c-wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
  .cell.c-empty{background:#efefef;color:#999}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;margin-bottom:18px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}

  /* results */
  .result{padding:34px 30px;text-align:center}
  .result h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:-.03em}
  .verdict{display:inline-block;padding:7px 20px;border-radius:999px;font-weight:600;font-size:16px;margin:10px 0;border:1px solid}
  .verdict.pass{background:var(--ok-l);color:var(--ok);border-color:#bfe6cd}
  .verdict.fail{background:var(--bad-l);color:var(--bad);border-color:#f2c9c9}
  .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 22px;min-width:110px}
  .stat b{display:block;font-size:26px;font-weight:600}
  .stat.g b{color:var(--ok)} .stat.r b{color:var(--bad)} .stat.m b{color:var(--muted)} .stat.p b{color:#000}
  .breakdown{max-width:520px;margin:26px auto 8px;text-align:left;border-top:1px solid var(--line);padding-top:22px}
  .bd-title{font-size:14px;font-weight:600;color:#000;margin-bottom:16px;letter-spacing:-.01em}
  .bd-row{margin:13px 0}
  .bd-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:7px}
  .bd-val{font-family:'Geist Mono',monospace;font-size:12.5px;color:#666}
  .bd-bar{height:7px;background:#eee;border-radius:999px;overflow:hidden}
  .bd-fill{height:100%;background:#000;border-radius:999px;transition:width .4s}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:26px;max-width:420px;text-align:center}
  .modal .box p{color:var(--muted)}
  .row{display:flex;gap:10px;justify-content:center;margin-top:16px}

  /* ---------- Mobil (tablet ve altı) ---------- */
  @media(max-width:600px){
    header{gap:8px 6px;padding:8px 12px}
    .h-title{font-size:13px;flex-basis:100%;order:-1;line-height:1.25;position:static;transform:none;left:auto;white-space:normal;text-align:center}
    .h-meta{display:contents}
    .exit-btn{order:1;padding:5px 12px;font-size:13px;line-height:18px}
    .timer-group{order:2;flex:1;justify-content:center;gap:6px;margin-top:0}
    .finish-btn{order:3;margin-left:0;padding:5px 12px;font-size:13px;line-height:18px}
    .timer-label{font-size:11px}
    .timer{font-size:12px;padding:5px 8px;min-width:52px}

    .wrap{margin:10px auto;padding:0 10px}
    .card{border-radius:12px}
    .qhead{padding:10px 14px;gap:8px}
    .qno{font-size:16px}
    .qsec{font-size:11px}
    .qprog{font-size:11px}
    .qleft,.qright{padding:14px}
    .qtext{font-size:15px}
    .opt{font-size:14px;padding:12px 12px;border-radius:12px}
    .opt-img{max-height:120px}
    .tag{font-size:11px}

    .footer{padding:12px 14px;gap:8px}
    .footer .spacer{display:none}
    .nav-btn{padding:10px 12px;font-size:14px;flex:1 1 40%}
    .nav-btn.next{flex-basis:100%;order:5}

    .grid{gap:6px;padding:12px;justify-content:center}
    .cell{width:34px;height:34px;font-size:12px}
    .legend{justify-content:center;gap:12px}

    .result{padding:20px}
    .result h1{font-size:22px}
    .verdict{font-size:17px;padding:7px 18px}
    .stats{gap:10px}
    .stat{min-width:calc(50% - 5px);padding:12px 10px}
    .stat b{font-size:22px}

    .modal .box{margin:16px;padding:22px}
  }
  /* Çok küçük telefonlar */
  @media(max-width:380px){
    .cell{width:30px;height:30px;font-size:11px}
    .h-title{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <button class="exit-btn" onclick="location.href=(window.SINAV_DEVAM_EDIYOR && !confirm('Sınav devam ediyor. Çıkarsan cevapların kaybolur. Çıkmak istiyor musun?')) ? location.href : '/panel/'">‹ Çıkış</button>
  <div class="h-title">Motorlu Taşıt Sürücü Kursiyerleri için e-Sınav</div>
  <div class="h-meta">
    <div class="timer-group">
      <span class="timer-label">Kalan süre</span>
      <div class="timer" id="timer">45:00</div>
    </div>
    <button class="finish-btn" id="finishBtn">Sınavı Bitir</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<!-- confirm finish -->
<div class="modal" id="confirmModal">
  <div class="box">
    <h2>Sınavı bitir?</h2>
    <p id="confirmText"></p>
    <div class="row">
      <button class="nav-btn" onclick="closeConfirm()">Vazgeç</button>
      <button class="nav-btn next" onclick="doFinish()">Evet, bitir</button>
    </div>
  </div>
</div>

<script src="/assets/js/questions-1.js"></script>
<script>
const Q = window.QUESTIONS;
const LETTERS = ["A","B","C","D"];
const PASS_CORRECT = 35;         // 50 soruda geçme (≈70 puan)
const DURATION = 45*60;          // 45 dakika

let cur = 0;
let answers = new Array(Q.length).fill(null); // seçilen index veya null
let finished = false;
let remaining = DURATION;
let timerId = null;

const app = document.getElementById('app');
const timerEl = document.getElementById('timer');

function fmt(s){const m=Math.floor(s/60),x=s%60;return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;}
function tick(){
  remaining--;
  timerEl.textContent = fmt(Math.max(0,remaining));
  if(remaining<=60) timerEl.classList.add('low');
  if(remaining<=0){ clearInterval(timerId); doFinish(true); }
}
function startTimer(){ window.SINAV_DEVAM_EDIYOR=true; timerEl.textContent=fmt(remaining); timerId=setInterval(tick,1000); }

function mediaHTML(q){
  if(!q.media && !q.caption) return '';
  if(q.media){
    const cap = q.caption || 'Görsel/video';
    if(q.media.type==='image'){
      return `<div class="media">
        <img src="${q.media.file}" alt="soru görseli"${q.mediaWidth?` style="max-width:${q.mediaWidth}"`:''}
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="media-fallback" style="display:none">🖼️ ${cap}
          <span class="ph">[görsel eklenecek → ${q.media.file}]</span></div>
      </div>`;
    } else {
      return `<div class="media">
        <video src="${q.media.file}" controls playsinline
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'"></video>
        <div class="media-fallback" style="display:none">🎬 ${cap}
          <span class="ph">[video eklenecek → ${q.media.file}]</span></div>
      </div>`;
    }
  }
  return `<div class="media"><div class="media-fallback">🖼️ ${q.caption}</div></div>`;
}

function render(){
  const q = Q[cur];
  const sel = answers[cur];
  const answeredCount = answers.filter(a=>a!==null).length;

  let opts = q.options.map((o,i)=>{
    const hasImg = !!q.optionImages;
    const inner = hasImg
      ? `<span class="lbl">${LETTERS[i]}</span><img class="opt-img" src="${q.optionImages[i]}" alt="şık ${LETTERS[i]}" onerror="this.style.display='none'">`
      : `<span class="lbl">${LETTERS[i]}</span><span>${o}</span>`;
    let cls='opt'+(hasImg?' has-img':'');
    if(finished){
      if(i===q.correct) cls+=' correct';
      else if(i===sel) cls+=' wrong';
      let tag='';
      if(i===q.correct) tag='<span class="tag ok">Doğru cevap</span>';
      else if(i===sel) tag='<span class="tag no">Senin cevabın</span>';
      return `<div class="${cls}">${inner}${tag}</div>`;
    }else{
      if(i===sel) cls+=' sel';
      return `<div class="${cls}" onclick="pick(${i})">${inner}</div>`;
    }
  }).join('');

  const noteHTML = (finished && q.note) ? `<div class="note">${q.uncertain?'⚠️':'ℹ️'} ${q.note}</div>` : '';

  app.innerHTML = `
  ${finished ? resultHTML() : ''}
  <div class="grid" id="grid">${gridHTML()}</div>
  <div class="legend">
    ${finished
      ? `<span><i style="background:var(--ok)"></i>Doğru</span><span><i style="background:var(--bad)"></i>Yanlış</span><span><i style="background:#efefef"></i>Boş</span>`
      : `<span><i style="background:var(--pink)"></i>İşaretlendi</span><span><i style="background:#fff;border:1px solid var(--line)"></i>Boş</span><span><i style="background:#fff;outline:2px solid #08090a"></i>Bulunduğun soru</span>`}
  </div>

  <div class="card ${finished?'review':''}">
    <div class="qhead">
      <span class="qno">Soru ${q.n}</span>
      <span class="qsec">${q.section}</span>
      <span class="qprog">${finished?'İnceleme modu':`İşaretlenen: ${answeredCount}/${Q.length}`}</span>
    </div>
    <div class="qbody">
      <div class="qleft">
        <div class="qtext">${q.stem}</div>
        ${mediaHTML(q)}
      </div>
      <div class="qright">
        <div class="opts${q.optionImages?' opts-2x2':''}">${opts}</div>
        ${noteHTML}
      </div>
    </div>
    <div class="footer">
      <button class="nav-btn" onclick="go(-1)" ${cur===0?'disabled':''}>‹ Önceki Soru</button>
      ${!finished ? `<button class="nav-btn" onclick="clearAns()">Temizle</button>` : ''}
      <div class="spacer"></div>
      <button class="nav-btn next" onclick="go(1)" ${cur===Q.length-1?'disabled':''}>Sonraki Soru ›</button>
    </div>
  </div>
  `;
}

function gridHTML(){
  return Q.map((q,i)=>{
    let cls='cell';
    if(finished){
      if(answers[i]===null) cls+=' c-empty';
      else if(answers[i]===q.correct) cls+=' c-correct';
      else cls+=' c-wrong';
    }else{
      if(answers[i]!==null) cls+=' answered';
    }
    if(i===cur) cls+=' current';
    return `<button class="${cls}" onclick="jump(${i})">${i+1}</button>`;
  }).join('');
}

function scoreObj(){
  let correct=0,wrong=0,empty=0;
  Q.forEach((q,i)=>{
    if(answers[i]===null) empty++;
    else if(answers[i]===q.correct) correct++;
    else wrong++;
  });
  return {correct,wrong,empty,points:correct*2};
}

function sectionBreakdownHTML(){
  const order=["İlk Yardım","Trafik ve Çevre","Araç Tekniği","Trafik Adabı"];
  const m={};
  Q.forEach((q,i)=>{
    if(!m[q.section]) m[q.section]={total:0,correct:0};
    m[q.section].total++;
    if(answers[i]===q.correct) m[q.section].correct++;
  });
  const rows=order.filter(k=>m[k]).map(k=>{
    const d=m[k], pct=Math.round(d.correct/d.total*100);
    return `<div class="bd-row">
      <div class="bd-top"><span>${k}</span><span class="bd-val">${d.correct}/${d.total} · %${pct}</span></div>
      <div class="bd-bar"><div class="bd-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="breakdown"><div class="bd-title">Konulara göre performans</div>${rows}</div>`;
}
function resultHTML(){
  const s=scoreObj();
  const pass=s.correct>=PASS_CORRECT;
  return `
  <div class="card" style="margin-top:16px">
    <div class="result">
      <h1>Sınav Sonucu</h1>
      <div class="verdict ${pass?'pass':'fail'}">${pass?'GEÇTİNİZ 🎉':'KALDINIZ'}</div>
      <div class="stats">
        <div class="stat g"><b>${s.correct}</b>Doğru</div>
        <div class="stat r"><b>${s.wrong}</b>Yanlış</div>
        <div class="stat m"><b>${s.empty}</b>Boş</div>
        <div class="stat p"><b>${s.points}</b>Puan</div>
      </div>
      ${sectionBreakdownHTML()}
      <p style="color:var(--muted);margin:8px 0 2px">Geçme koşulu: en az ${PASS_CORRECT} doğru (100 üzerinden 70 puan).</p>
      <p style="color:#444;max-width:660px;margin:12px auto 4px;font-size:13px;line-height:1.6;background:#f6f7f9;border:1px solid var(--line);border-radius:10px;padding:14px 18px;text-align:left">
        <b>Puanlama:</b> Ehliyet sınavında yanlış cevaplar doğru yanıtları silmez veya puanınızı düşürmez. Sınavda 50 soru sorulur ve her sorunun puan değeri 2'dir. Başarılı olmak için en az 35 doğru yaparak 70 puan almanız yeterlidir. Yanlış cevaplarınız net sayınızı etkilemediği için, emin olmadığınız sorularda boş bırakmak yerine şansınızı denemeniz önerilir.
      </p>
      <div class="row">
        <button class="nav-btn next" onclick="restart()">Tekrar Başla</button>
      </div>
    </div>
  </div>`;
}

function pick(i){ answers[cur]=i; render(); }
function clearAns(){ answers[cur]=null; render(); }
function go(d){ const n=cur+d; if(n>=0&&n<Q.length){cur=n; render(); window.scrollTo({top:0,behavior:'smooth'});} }
function jump(i){ cur=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// finish flow
const confirmModal=document.getElementById('confirmModal');
document.getElementById('finishBtn').onclick=()=>{
  if(finished){ restart(); return; }
  const empty=answers.filter(a=>a===null).length;
  document.getElementById('confirmText').textContent =
    empty>0 ? `${empty} soru boş kaldı. Yine de bitirmek istiyor musunuz?` : `Tüm sorular işaretlendi. Sınavı bitiriyoruz.`;
  confirmModal.classList.add('show');
};
function closeConfirm(){ confirmModal.classList.remove('show'); }
function doFinish(timeUp){
  closeConfirm();
  finished=true; window.SINAV_DEVAM_EDIYOR=false;
  clearInterval(timerId);
  document.getElementById('finishBtn').textContent='Tekrar Başla';
  document.querySelector('.timer-label').style.display='none';
  timerEl.style.display='none';
  if(timeUp) alert('Süre doldu! Sınav otomatik olarak bitirildi.');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function exitExam(){
  if(!finished && !confirm('Sınavdan çıkıp ana sayfaya dönmek istediğinize emin misiniz? İşaretledikleriniz kaybolacak.')) return;
  location.href='index.html';
}
function restart(){
  answers=new Array(Q.length).fill(null);
  cur=0; finished=false; remaining=DURATION;
  timerEl.classList.remove('low');
  document.querySelector('.timer-label').style.display='';
  timerEl.style.display='';
  document.getElementById('finishBtn').textContent='Sınavı Bitir';
  clearInterval(timerId); startTimer(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// keyboard: ← → nav, A-D select
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight') go(1);
  else if(!finished){
    const k=e.key.toUpperCase();
    const idx=LETTERS.indexOf(k);
    if(idx>=0) pick(idx);
  }
});

startTimer();
render();
