<title>Panel — ehliyet.digital</title>
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root{--fg:#08090a;--muted:#6a6f76;--line:#ececec;--pk-yan:186px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter','Inter-fallback',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
  a{color:inherit;text-decoration:none}


  /* ---- Üst bar ---- */
  .ust{position:fixed;top:0;left:var(--pk-yan);right:0;height:60px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(10px);z-index:20}
  .baslik{font-size:15px;font-weight:500;letter-spacing:-.015em}
  .ust-sag{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
  .kucuk-btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;
    font-size:13.5px;font-weight:450;line-height:1;padding:9px 15px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;transition:.12s}
  .kucuk-btn:hover{border-color:#c8c8c8;background:#fafafa}

  /* Profil: avatar + ad, hap biçiminde */
  .profil-btn{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font:inherit;font-size:13.5px;
    color:var(--fg);transition:.12s}
  .profil-btn:hover{border-color:#c8c8c8;background:#fafafa}
  .profil-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:#ececec;
    object-fit:cover;display:inline-flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;color:var(--fg);overflow:hidden}
  .profil-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .profil-ad{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .profil-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:160px;background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.10);
    padding:6px;display:none;z-index:60}
  .profil-menu.acik{display:block}
  .profil-menu .mail{padding:9px 12px 7px;font-size:12.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .profil-menu button{display:block;width:100%;text-align:left;background:none;border:none;
    font:inherit;font-size:14px;color:var(--fg);padding:9px 12px;border-radius:8px;cursor:pointer}
  .profil-menu button:hover{background:#f5f5f5}
  .profil-menu .ayrac{height:1px;background:var(--line);margin:5px 2px}

  /* ---- İçerik ---- */
  main{margin-left:var(--pk-yan);padding-top:60px}
  .icerik{padding:36px 24px 72px;max-width:1080px}
  .sec-basi{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.025em}
  .sec-alt{margin:0 0 30px;color:var(--muted);font-size:15px;line-height:1.55}

  .sinav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
  .sinav-kart{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;
    padding:22px;background:#fff;transition:.15s;min-height:250px}
  a.sinav-kart:hover{border-color:#d4d4d4;box-shadow:0 10px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
  .sinav-kart h3{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .sinav-kart .aciklama{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .sinav-kart ul{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:9px}
  .sinav-kart li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#3a3d42}
  .sinav-kart li svg{flex-shrink:0}
  .bosluk{flex:1}
  .kart-btn{display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;
    padding:10px 16px;border-radius:999px;background:#08090a;color:#fff;border:1px solid #08090a}
  .kart-btn.pasif{background:#fff;color:#aab0b6;border-color:var(--line);pointer-events:none}
  .sinav-kart.yakinda{opacity:.75}
  .sinav-kart.yakinda li{color:#aab0b6}
  .rozet{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;
    background:#eef7f0;color:#1a7f37;margin-left:8px;vertical-align:middle}

  /* ---- Yakında ekranı ---- */
  .yakinda-ekran{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;min-height:calc(100vh - 60px);padding:24px}
  .yakinda-ekran .halka{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--muted)}
  .yakinda-ekran h2{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .yakinda-ekran p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55;max-width:330px}

  .yukleniyor{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:15px}

  /* ---- Profil formu ---- */
  .kart{border:1px solid var(--line);border-radius:14px;padding:26px;max-width:640px}
  .kisi-ust{display:flex;align-items:center;gap:16px;margin-bottom:26px;padding-bottom:22px;
    border-bottom:1px solid var(--line)}
  .kisi-ust .foto{width:56px;height:56px;border-radius:50%;background:#ececec;object-fit:cover;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;overflow:hidden}
  .kisi-ust .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .kisi-ust .isim{font-size:16.5px;font-weight:600;letter-spacing:-.015em}
  .kisi-ust .alt{color:var(--muted);font-size:13.5px;margin-top:2px}

  .alan-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .alan{display:flex;flex-direction:column;gap:6px}
  .alan.genis{grid-column:1 / -1}
  .alan label{font-size:13px;font-weight:500;color:#3a3d42}
  .alan .ipucu{color:var(--muted);font-weight:400}
  .alan input,.alan select{font-family:inherit;font-size:14.5px;color:var(--fg);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:.15s;width:100%}
  .alan input:focus,.alan select:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(8,9,10,.06)}
  .alan input:disabled{background:#fafafa;color:var(--muted);cursor:not-allowed}
  .alan .hata{color:#b3261e;font-size:12.5px;display:none}
  .alan.hatali input{border-color:#b3261e}
  .alan.hatali .hata{display:block}

  .form-alt{display:flex;align-items:center;gap:14px;margin-top:24px}
  .kaydet-btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-weight:500;
    font-size:14px;line-height:1;padding:11px 22px;border-radius:999px;background:#08090a;color:#fff;
    border:1px solid #08090a;cursor:pointer;transition:.15s}
  .kaydet-btn:hover{background:#26282c}
  .kaydet-btn:disabled{opacity:.5;cursor:default}
  .form-durum{font-size:13.5px;color:var(--muted)}
  .form-durum.ok{color:#1a7f37}
  .form-durum.hata{color:#b3261e}
  @media(max-width:560px){.alan-grid{grid-template-columns:1fr}.kart{padding:20px}}

  /* ---- Dar ekran ---- */
  /* ---- Ders notları ---- */
  .ders-kartlar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:960px){.ders-kartlar{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.ders-kartlar{grid-template-columns:1fr}}
  .ders-kart{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;
    padding:22px;background:#fff;transition:.15s;cursor:pointer;min-height:200px}
  .ders-kart:hover{border-color:#d4d4d4;box-shadow:0 10px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
  .ders-kart h3{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .ders-kart .ders-aciklama{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .ders-kart .ders-sayi{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);
    letter-spacing:.04em;margin-bottom:16px}
  .ders-kart .bosluk{flex:1}
  .ders-kart .kart-btn{display:inline-flex;align-items:center;justify-content:center;font-size:12px;
    font-weight:500;padding:7px 13px;border-radius:999px;background:#08090a;color:#fff;border:1px solid #08090a;
    align-self:flex-start}

  .geri-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font:inherit;
    font-size:14px;font-weight:450;color:var(--muted);cursor:pointer;padding:0;margin-bottom:20px}
  .geri-btn:hover{color:var(--fg)}

  .konu-liste{display:flex;flex-direction:column}
  .konu-satir{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);
    cursor:pointer;transition:.12s}
  .konu-satir:first-child{border-top:1px solid var(--line)}
  .konu-satir:hover{opacity:.7}
  .konu-num{font-family:'Geist Mono',monospace;font-size:13px;color:var(--muted);flex-shrink:0;min-width:28px}
  .konu-body{display:flex;flex-direction:column;gap:2px;flex:1}
  .konu-baslik{font-weight:600;font-size:15.5px;letter-spacing:-.015em}
  .konu-alt{color:var(--muted);font-size:13.5px}
  .konu-ok{color:var(--muted);flex-shrink:0;transition:transform .15s}
  .konu-satir:hover .konu-ok{transform:translateX(3px);color:var(--fg)}

  .ders-icerik{max-width:800px}
  .ders-icerik h2{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin:38px 0 10px}
  .ders-icerik p{margin:14px 0;font-size:15.5px;line-height:1.75;color:#3a3d42}
  .ders-icerik b{color:var(--fg);font-weight:600}
  .ders-icerik ul,.ders-icerik ol{margin:10px 0;padding-left:20px}
  .ders-icerik li{font-size:15.5px;line-height:1.7;color:#3a3d42;margin-bottom:6px}
  .ders-yukleniyor{display:flex;align-items:center;justify-content:center;padding:80px 0;color:var(--muted);font-size:14px}
  .ders-hata{text-align:center;padding:60px 0;color:var(--muted)}
  .ders-hata button{margin-top:14px;font:inherit;font-size:14px;padding:9px 18px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
  .ders-hata button:hover{border-color:#c8c8c8}

  /* ---- Hap bilgiler panel ---- */
  .hap-icerik .grup{margin-bottom:32px}
  .hap-icerik .grup h2{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 14px;color:var(--fg)}
  .hap-icerik .hap-list{display:flex;flex-direction:column;gap:10px}
  .hap-icerik .hap{display:flex;align-items:baseline;gap:14px;font-size:15px;line-height:1.65;color:#3a3d42}
  .hap-icerik .hap-num{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0;min-width:22px}
  .hap-icerik .hap b{color:var(--fg);font-weight:600}

  /* ---- Ana sayfa dashboard ---- */
  .hos-geldin{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.025em}
  .hos-alt{margin:0 0 28px;color:var(--muted);font-size:15px}

  .hizli-erisim{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}
  .he-kart{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;transition:.15s;cursor:pointer;text-decoration:none;color:inherit}
  .he-kart:hover{border-color:#d4d4d4;box-shadow:0 10px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
  .he-kart h3{margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.02em}
  .he-kart p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5;flex:1}
  .he-kart .he-link{font-size:13px;font-weight:500;color:var(--fg)}
  @media(max-width:720px){.hizli-erisim{grid-template-columns:1fr}}

  .sonuc-kart{border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:28px}
  .sonuc-kart h2{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .sonuc-kart .sonuc-tarih{font-size:13px;color:var(--muted);margin:0 0 18px}
  .sonuc-ust{display:flex;gap:24px;margin-bottom:20px;flex-wrap:wrap}
  .sonuc-stat{text-align:center}
  .sonuc-stat b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em}
  .sonuc-stat span{font-size:12px;color:var(--muted)}
  .sonuc-stat.gecti b{color:#1a7f37}
  .sonuc-stat.kaldi b{color:#b3261e}
  .sonuc-bar-wrap{margin-bottom:8px}
  .sonuc-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .sonuc-bar-label span:last-child{color:var(--muted);font-family:'Geist Mono',monospace;font-size:12px}
  .sonuc-bar{height:6px;background:#f2f2f2;border-radius:3px;overflow:hidden}
  .sonuc-bar-fill{height:100%;border-radius:3px;transition:width .3s}
  .sonuc-bar-fill.iyi{background:#1a7f37}
  .sonuc-bar-fill.orta{background:#e8722a}
  .sonuc-bar-fill.zayif{background:#b3261e}

  .oneri-baslik{margin:32px 0 14px;font-size:17px;font-weight:600;letter-spacing:-.02em}
  .oneri-liste{display:flex;flex-direction:column;gap:10px}
  .oneri-kart{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.12s}
  .oneri-kart:hover{border-color:#d4d4d4;background:#fafafa}
  .oneri-ikon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
  .oneri-ikon.zayif{background:#fdf1f1;color:#b3261e}
  .oneri-ikon.orta{background:#fff7ed;color:#e8722a}
  .oneri-body{flex:1;min-width:0}
  .oneri-body b{display:block;font-size:14px;margin-bottom:2px}
  .oneri-body span{font-size:12.5px;color:var(--muted)}
  .oneri-ok{color:var(--muted);flex-shrink:0}
  .oneri-grup{margin-bottom:6px}
  .oneri-konular{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0 52px}
  .oneri-konu{font-size:12.5px;font-weight:500;color:var(--fg);background:#f5f5f5;padding:5px 12px;
    border-radius:8px;cursor:pointer;transition:.12s;text-decoration:none}
  .oneri-konu:hover{background:#e8e8e8}

  /* Puan grafiği */
  .grafik-wrap{border:1px solid var(--line);border-radius:14px;padding:20px 16px 8px;margin-bottom:28px;overflow-x:auto}
  .puan-grafik{width:100%;height:auto;display:block}

  /* Sınav geçmişi tablosu */
  .sonuc-tablo{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:28px}
  .st-baslik,.st-satir{display:grid;grid-template-columns:1.2fr 1fr .7fr .6fr .6fr .5fr .8fr;padding:12px 18px;gap:8px;align-items:center;font-size:13.5px}
  .st-baslik{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#fafafa;border-bottom:1px solid var(--line)}
  .st-satir{border-bottom:1px solid var(--line)}
  .st-satir:last-child{border-bottom:none}
  .st-sinav{font-weight:600}
  .st-tarih{color:var(--muted)}
  .st-puan{font-weight:600;font-family:'Geist Mono',monospace}
  .st-puan.gecti{color:#1a7f37}
  .st-puan.kaldi{color:#b3261e}
  .st-sonuc{font-weight:500;font-size:12.5px;padding:3px 10px;border-radius:6px;text-align:center;width:fit-content}
  .st-sonuc.gecti{background:#eef7f0;color:#1a7f37}
  .st-sonuc.kaldi{background:#fdf1f1;color:#b3261e}
  @media(max-width:640px){.st-baslik,.st-satir{grid-template-columns:1fr 1fr 1fr;font-size:12px;padding:10px 14px}
    .st-baslik span:nth-child(n+4),.st-satir span:nth-child(n+4){display:none}}

  /* ---- Ayarlar — tehlike kartı & silme modalı ---- */
  .tehlike-kart{border-color:#fecdd3}
  .sil-btn{font-family:inherit;font-size:13.5px;font-weight:500;padding:9px 18px;border-radius:9px;
    background:#fff;color:#b3261e;border:1px solid #fecdd3;cursor:pointer;transition:.12s}
  .sil-btn:hover{background:#fef2f2;border-color:#f87171}
  .sil-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px}
  .sil-modal-bg[hidden]{display:none}
  .sil-modal{background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.15)}
  .sil-modal h3{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .sil-modal p{margin:0 0 20px;font-size:14px;color:var(--muted);line-height:1.55}
  .sil-modal-btns{display:flex;gap:10px}
  .sil-iptal{font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:9px;
    background:#fff;color:var(--fg);border:1px solid var(--line);cursor:pointer;transition:.12s}
  .sil-iptal:hover{background:#fafafa;border-color:#c8c8c8}
  .sil-onayla{font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:9px;
    background:#b3261e;color:#fff;border:1px solid #b3261e;cursor:pointer;transition:.12s}
  .sil-onayla:hover{background:#9a2019}
  .sil-onayla:disabled{opacity:.5;cursor:default}
  .sil-durum{font-size:13px;margin:12px 0 0 !important;color:#b3261e}

  .ders-icerik .quiz-card{margin-top:40px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .ders-icerik .quiz-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;background:#fafafa;border:none;cursor:pointer;font:inherit;font-size:16px;
    font-weight:600;letter-spacing:-.02em;color:var(--fg)}
  .ders-icerik .quiz-toggle:hover{background:#f2f2f2}
  .ders-icerik .quiz-toggle .chevron{transition:transform .2s;color:var(--muted)}
  .ders-icerik .quiz-card.open .quiz-toggle .chevron{transform:rotate(180deg)}
  .ders-icerik .quiz-body{display:none;padding:4px 22px 20px}
  .ders-icerik .quiz-card.open .quiz-body{display:block}
  .ders-icerik .quiz-card ol{list-style:none;padding:0;margin:0;counter-reset:q}
  .ders-icerik .quiz-card li{counter-increment:q;padding:16px 0;border-top:1px solid var(--line);margin:0}
  .ders-icerik .quiz-card li:first-child{border-top:none;padding-top:0}
  .ders-icerik .quiz-card .qq{font-weight:500;font-size:14.5px;line-height:1.5;margin:0 0 8px}
  .ders-icerik .quiz-card .qq::before{content:counter(q) ". ";font-family:'Geist Mono',monospace;color:var(--muted);font-size:13px;font-weight:400}
  .ders-icerik .quiz-card .qo{font-size:13.5px;line-height:1.6;color:#444;padding:4px 8px;border-radius:8px;cursor:pointer;transition:.12s;user-select:none}
  .ders-icerik .quiz-card .qo:hover{background:#f5f5f5}
  .ders-icerik .quiz-card .qo .lbl{font-family:'Geist Mono',monospace;color:var(--muted);margin-right:6px}
  .ders-icerik .quiz-card .qo.picked{background:#08090a;color:#fff;border-radius:8px}
  .ders-icerik .quiz-card .qo.picked .lbl{color:#fff}
  .ders-icerik .quiz-card.revealed .qo{cursor:default}
  .ders-icerik .quiz-card.revealed .qo:hover{background:transparent}

          <h3>Deneme Sınavı</h3>
          <p>50 soru, 45 dakika. Gerçek sınav formatında kendini test et.</p>
          <span class="he-link">Sınava Git →</span>
        </div>
        <div class="he-kart" data-he="dersler">
          <h3>Ders Notları</h3>
          <p>4 ders, 43 konu. Sınavda çıkan bilgilere odaklı.</p>
          <span class="he-link">Derslere Git →</span>
        </div>
        <div class="he-kart" data-he="hapbilgiler">
          <h3>Hap Bilgiler</h3>
          <p>76 bilgi, ~15 dakika. Sınavdan önce son tekrar.</p>
          <span class="he-link">Bilgilere Git →</span>
        </div>
      </div>`;

    // Sınav sonuçlarını çek
    try {
      const { denemeleriGetir } = await import('/assets/js/firebase.js');
      const denemeler = await denemeleriGetir(user.uid);

      if (denemeler.length > 0) {
        // Tüm sınav sonuçları tablosu
        html += `<h2 class="oneri-baslik">Sınav Geçmişin</h2>
          <div class="sonuc-tablo">
            <div class="st-baslik"><span>Sınav</span><span>Tarih</span><span>Puan</span><span>Doğru</span><span>Yanlış</span><span>Boş</span><span>Sonuç</span></div>`;
        for (const d of denemeler) {
          const tarih = d.kaydedilmeAt?.toDate ? d.kaydedilmeAt.toDate().toLocaleDateString('tr-TR', { day:'numeric', month:'short' }) : '—';
          html += `<div class="st-satir">
            <span class="st-sinav">${d.sinav || '—'}</span><span class="st-tarih">${tarih}</span>
            <span class="st-puan ${d.gecti?'gecti':'kaldi'}">${d.puan}</span>
            <span>${d.dogru}</span><span>${d.yanlis}</span><span>${d.bos}</span>
            <span class="st-sonuc ${d.gecti?'gecti':'kaldi'}">${d.gecti?'Geçti':'Kaldı'}</span>
          </div>`;
        }
        html += `</div>`;

        // Puan line chart (eskiden yeniye)
        const chartData = [...denemeler].reverse();
        if (chartData.length >= 2) {
          const minPuan = Math.min(...chartData.map(d => d.puan));
          const yMin = Math.max(0, Math.floor((minPuan - 10) / 10) * 10);
          const yMax = 100;
          const W = 700, H = 180, PL = 34, PR = 50, PT = 24, PB = 36;
          const iW = W - PL - PR, iH = H - PT - PB;
          const yScale = v => PT + iH - ((v - yMin) / (yMax - yMin)) * iH;

          const points = chartData.map((d, i) => {
            const x = PL + (i / (chartData.length - 1)) * iW;
            const tarih = d.kaydedilmeAt?.toDate ? d.kaydedilmeAt.toDate().toLocaleDateString('tr-TR', { day:'numeric', month:'short' }) : '';
            return { x, y: yScale(d.puan), puan: d.puan, gecti: d.gecti, alt: tarih || (d.sinav || '') };
          });
          const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ');

          let svg = '';
          // Y ekseni + grid
          svg += `<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT + iH}" stroke="#e0e0e0" stroke-width="1"/>`;
          svg += `<line x1="${PL}" y1="${PT + iH}" x2="${PL + iW}" y2="${PT + iH}" stroke="#e0e0e0" stroke-width="1"/>`;
          for (const val of [yMin, 70, yMax]) {
            const yy = yScale(val);
            if (val === 70) continue;
            svg += `<line x1="${PL}" y1="${yy}" x2="${PL + iW}" y2="${yy}" stroke="#f2f2f2" stroke-width="1"/>`;
            svg += `<text x="${PL - 6}" y="${yy + 4}" text-anchor="end" fill="#bbb" font-size="10" font-family="'Geist Mono',monospace">${val}</text>`;
          }
          // Geçme çizgisi
          const gecmeY = yScale(70);
          svg += `<line x1="${PL}" y1="${gecmeY}" x2="${PL + iW}" y2="${gecmeY}" stroke="#b3261e" stroke-width="1" stroke-dasharray="5,4" opacity=".3"/>`;
          svg += `<text x="${PL + iW + 6}" y="${gecmeY + 4}" fill="#b3261e" font-size="9" font-family="'Geist Mono',monospace" opacity=".6">70</text>`;
          // Veri çizgisi
          svg += `<path d="${line}" fill="none" stroke="#08090a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
          // Noktalar + etiketler
          for (const p of points) {
            const c = p.gecti ? '#1a7f37' : '#b3261e';
            const above = p.y > yScale(70) + 5;
            const ty = above ? p.y - 12 : p.y + 18;
            svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/>`;
            svg += `<text x="${p.x}" y="${ty}" text-anchor="middle" fill="${c}" font-size="11" font-weight="600" font-family="'Geist Mono',monospace">${p.puan}</text>`;
            svg += `<text x="${p.x}" y="${H - 6}" text-anchor="middle" fill="#999" font-size="9" font-family="Inter,sans-serif">${p.alt}</text>`;
          }
          html += `<div class="grafik-wrap"><svg class="puan-grafik" viewBox="0 0 ${W} ${H}">${svg}</svg></div>`;
        }

        // Tüm sınavlardan birleşik performans
        const toplam = {};
        for (const d of denemeler) {
          if (!d.bolumler) continue;
          for (const [bol, v] of Object.entries(d.bolumler)) {
            if (!toplam[bol]) toplam[bol] = { dogru:0, toplam:0 };
            toplam[bol].dogru += v.dogru;
            toplam[bol].toplam += v.toplam;
          }
        }
        const siralanmis = Object.entries(toplam).sort((a,b) => (a[1].dogru/a[1].toplam) - (b[1].dogru/b[1].toplam));

        if (siralanmis.length > 0) {
          html += `<h2 class="oneri-baslik">Genel Performansın</h2><div class="sonuc-kart">`;
          for (const [bol, v] of siralanmis) {
            const pct = Math.round(v.dogru / v.toplam * 100);
            const renk = pct >= 80 ? 'iyi' : pct >= 60 ? 'orta' : 'zayif';
            html += `<div class="sonuc-bar-wrap">
              <div class="sonuc-bar-label"><span>${bol}</span><span>${v.dogru}/${v.toplam} · %${pct}</span></div>
              <div class="sonuc-bar"><div class="sonuc-bar-fill ${renk}" style="width:${pct}%"></div></div>
            </div>`;
          }
          html += `</div>`;

          // Çalışman gereken konular — ders + konu bazında
          const zayiflar = siralanmis.filter(([,v]) => (v.dogru / v.toplam) < 0.8);
          if (zayiflar.length > 0) {
            html += `<h2 class="oneri-baslik">Çalışman Gereken Konular</h2><div class="oneri-liste">`;
            for (const [bol, v] of zayiflar) {
              const pct = Math.round(v.dogru / v.toplam * 100);
              const renk = pct >= 60 ? 'orta' : 'zayif';
              const info = BOLUM_DERS_LINK[bol];
              if (!info) continue;
              const konular = BOLUM_ONERILEN[bol] || [];
              html += `<div class="oneri-grup">
                <div class="oneri-kart" data-oneri-kat="${info.link}">
                  <div class="oneri-ikon ${renk}">📚</div>
                  <div class="oneri-body"><b>${bol} · %${pct}</b><span>${info.aciklama}</span></div>
                  <svg class="oneri-ok" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </div>
                ${konular.length ? `<div class="oneri-konular">${konular.map(k =>
                  `<a class="oneri-konu" data-oneri-konu="${info.link}/${k.slug}">${k.baslik} →</a>`
                ).join('')}</div>` : ''}
              </div>`;
            }
            html += `</div>`;
          }
        }
      }
    } catch (e) {
      console.error('Sonuçlar yüklenemedi:', e);
    }

    anasayfaRoot.innerHTML = html;

    // Hızlı erişim kartları tıklama
    anasayfaRoot.querySelectorAll('[data-he]').forEach(k => {
      k.addEventListener('click', () => goster(k.dataset.he));
    });

    // Öneri kartları tıklama — ders notlarına yönlendir
    anasayfaRoot.querySelectorAll('[data-oneri-kat]').forEach(k => {
      k.addEventListener('click', () => {
        goster('dersler');
        setTimeout(() => derslerKategori(k.dataset.oneriKat), 50);
      });
    });
    anasayfaRoot.querySelectorAll('[data-oneri-konu]').forEach(k => {
      k.addEventListener('click', (e) => {
        e.stopPropagation();
        const [katId, slug] = k.dataset.oneriKonu.split('/');
        goster('dersler');
        setTimeout(() => derslerKonu(katId, slug), 50);
      });
    });
  }

  const dersOnbellek = {};
  const derslerRoot = kabuk.querySelector('#dersler-root');

  function derslerAnasayfa() {
    const satirlar = Object.entries(DERS_KATEGORILER).map(([id, kat]) => `
      <div class="ders-kart" data-kat="${id}">
        <h3>${kat.ad}</h3>
        <p class="ders-aciklama">${kat.aciklama}</p>
        <span class="ders-sayi">${kat.konular.length} KONU</span>
        <div class="bosluk"></div>
        <span class="kart-btn">Konulara Git</span>
      </div>`).join('');

    derslerRoot.innerHTML = `
      <h1 class="sec-basi">Ders Notları</h1>
      <p class="sec-alt">Ehliyet sınavına hazırlık için tüm ders notları.</p>
      <div class="ders-kartlar">${satirlar}</div>`;

    derslerRoot.querySelectorAll('.ders-kart').forEach(k => {
      k.addEventListener('click', () => derslerKategori(k.dataset.kat));
    });
    window.scrollTo({ top: 0 });
  }

  function derslerKategori(katId) {
    const kat = DERS_KATEGORILER[katId];
    if (!kat) return;

    const satirlar = kat.konular.map((k, i) => `
      <div class="konu-satir" data-slug="${k.slug}">
        <span class="konu-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="konu-body">
          <span class="konu-baslik">${k.baslik}</span>
          <span class="konu-alt">${k.alt}</span>
        </div>
        <svg class="konu-ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`).join('');

    derslerRoot.innerHTML = `
      <button class="geri-btn" data-geri="anasayfa">← Tüm Dersler</button>
      <h1 class="sec-basi">${kat.ad}</h1>
      <p class="sec-alt">${kat.aciklama}</p>
      <div class="konu-liste">${satirlar}</div>`;

    derslerRoot.querySelector('[data-geri]').addEventListener('click', derslerAnasayfa);
    derslerRoot.querySelectorAll('.konu-satir').forEach(s => {
      s.addEventListener('click', () => derslerKonu(katId, s.dataset.slug));
    });
    window.scrollTo({ top: 0 });
  }

  async function derslerKonu(katId, slug) {
    const kat = DERS_KATEGORILER[katId];
    if (!kat) return;
    const konu = kat.konular.find(k => k.slug === slug);
    if (!konu) return;

    derslerRoot.innerHTML = `
      <button class="geri-btn" data-geri="kategori">← ${kat.ad}</button>
      <h1 class="sec-basi">${konu.baslik}</h1>
      <div class="ders-yukleniyor">Yükleniyor…</div>`;

    derslerRoot.querySelector('[data-geri]').addEventListener('click', () => derslerKategori(katId));
    window.scrollTo({ top: 0 });

    const onbellekAnahtar = katId + '/' + slug;
    try {
      let veri = dersOnbellek[onbellekAnahtar];
      if (!veri) {
        const res = await fetch('/dersler/' + katId + '/' + slug + '/');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();

        let govde = '';
        const bStart = html.indexOf('<!-- BODY_START -->');
        const bEnd = html.indexOf('<!-- BODY_END -->');
        if (bStart !== -1 && bEnd !== -1) {
          govde = html.slice(bStart + '<!-- BODY_START -->'.length, bEnd).trim();
        }

        veri = { govde };
        dersOnbellek[onbellekAnahtar] = veri;
      }

      const yukEl = derslerRoot.querySelector('.ders-yukleniyor');
      if (!yukEl) return;

      const icerikDiv = document.createElement('div');
      icerikDiv.className = 'ders-icerik';
      icerikDiv.innerHTML = veri.govde;
      yukEl.replaceWith(icerikDiv);
    } catch (err) {
      const yukEl = derslerRoot.querySelector('.ders-yukleniyor');
      if (!yukEl) return;
      yukEl.outerHTML = `
        <div class="ders-hata">
          <p>İçerik yüklenemedi.</p>
          <button type="button" data-tekrar>Tekrar Dene</button>
        </div>`;
      derslerRoot.querySelector('[data-tekrar]').addEventListener('click', () => derslerKonu(katId, slug));
    }
  }

  // ---- Hap Bilgiler ----
  const HAP_KATEGORILER = {
    'arac-teknigi': { ad: 'Araç Tekniği', aciklama: 'İkaz ışıkları, arıza sebepleri ve bakım kuralları', sayi: 17 },
    'trafik-ve-cevre': { ad: 'Trafik ve Çevre', aciklama: 'Hız sınırları, geçiş hakkı ve trafik işaretleri', sayi: 27 },
    'ilk-yardim': { ad: 'İlk Yardım', aciklama: 'Kanama, kırık, yanık müdahalesi ve yaşam desteği', sayi: 21 },
    'trafik-adabi': { ad: 'Trafik Adabı', aciklama: 'Trafikte iletişim, saygı ve sorumluluk', sayi: 11 }
  };
  const hapOnbellek = {};
  const hapRoot = kabuk.querySelector('#hapbilgiler-root');

  function hapAnasayfa() {
    if (!hapRoot) return;
    hapRoot.innerHTML = `
      <h1 class="sec-basi">Hap Bilgiler</h1>
      <p class="sec-alt">Ehliyet sınavında çıkan bilgiler, kısa ve öz.</p>
      <div class="ders-kartlar">
        ${Object.entries(HAP_KATEGORILER).map(([id, k]) => `
          <div class="ders-kart" data-hap-kat="${id}">
            <h3>${k.ad}</h3>
            <p class="ders-aciklama">${k.aciklama}</p>
            <span class="ders-sayi">${k.sayi} BİLGİ</span>
            <div class="bosluk"></div>
            <span class="kart-btn">Bilgilere Git</span>
          </div>`).join('')}
      </div>`;
    hapRoot.querySelectorAll('[data-hap-kat]').forEach(k => {
      k.addEventListener('click', () => hapIcerik(k.dataset.hapKat));
    });
  }

  async function hapIcerik(katId) {
    const kat = HAP_KATEGORILER[katId];
    if (!kat) return;

    hapRoot.innerHTML = `
      <button class="geri-btn" data-geri>← Tüm Hap Bilgiler</button>
      <h1 class="sec-basi">${kat.ad}</h1>
      <div class="ders-yukleniyor">Yükleniyor…</div>`;

    hapRoot.querySelector('[data-geri]').addEventListener('click', hapAnasayfa);
    window.scrollTo({ top: 0 });

    try {
      let govde = hapOnbellek[katId];
      if (!govde) {
        const res = await fetch('/hap-bilgiler/' + katId + '/');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();

        const bStart = html.indexOf('<!-- BODY_START -->');
        const bEnd = html.indexOf('<!-- BODY_END -->');
        if (bStart !== -1 && bEnd !== -1) {
          govde = html.slice(bStart + '<!-- BODY_START -->'.length, bEnd).trim();
        } else {
          govde = '<p>İçerik bulunamadı.</p>';
        }
        hapOnbellek[katId] = govde;
      }

      const yukEl = hapRoot.querySelector('.ders-yukleniyor');
      if (!yukEl) return;

      const icerikDiv = document.createElement('div');
      icerikDiv.className = 'hap-icerik';
      icerikDiv.innerHTML = govde;
      yukEl.replaceWith(icerikDiv);
    } catch (err) {
      const yukEl = hapRoot.querySelector('.ders-yukleniyor');
      if (!yukEl) return;
      yukEl.outerHTML = `
        <div class="ders-hata">
          <p>İçerik yüklenemedi.</p>
          <button type="button" data-tekrar>Tekrar Dene</button>
        </div>`;
      hapRoot.querySelector('[data-tekrar]').addEventListener('click', () => hapIcerik(katId));
    }
  }

  function goster(ad) {
    bolumler.forEach(b => { b.hidden = b.dataset.gorunumIcerik !== ad; });
    ogeler.forEach(o => o.classList.toggle('aktif', o.dataset.gorunum === ad));
    baslik.textContent = BASLIKLAR[ad] || '';
    // URL'yi güncelle ki sayfa yenilenince aynı bölüm açılsın
    const url = ad === 'anasayfa' ? '/panel/' : '/panel/?g=' + ad;
    history.replaceState(null, '', url);
    if (ad === 'anasayfa') anasayfaGoster();
    if (ad === 'dersler') derslerAnasayfa();
    if (ad === 'hapbilgiler') hapAnasayfa();
  }
  ogeler.forEach(o => o.addEventListener('click', () => goster(o.dataset.gorunum)));

  // Alt sayfalardaki yan menü /panel/?g=<görünüm> ile geri döner.
  const istenen = new URLSearchParams(location.search).get('g');
  goster((istenen && BASLIKLAR[istenen]) ? istenen : 'anasayfa');

  // ---- Profil ----
  const btn = kabuk.querySelector('[data-profil]');
  const menu = kabuk.querySelector('.profil-menu');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const acik = menu.classList.toggle('acik');
    btn.setAttribute('aria-expanded', String(acik));
  });
  document.addEventListener('click', () => {
    menu.classList.remove('acik');
    btn.setAttribute('aria-expanded', 'false');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu.classList.remove('acik'); });

  kabuk.querySelector('[data-profilim]').addEventListener('click', () => {
    menu.classList.remove('acik');
    goster('profil');
  });
  kabuk.querySelector('[data-cikis]').addEventListener('click', async () => {
    const { cikisOnayiAc } = await import('/assets/js/cikis-onay.js');
    cikisOnayiAc(async () => {
      await cikisYap();
      location.href = '/';
    });
  });
}

/* ---- Profil formu ---- */

/** Rakamları 0532 123 45 67 biçiminde gösterir. */
function telefonBicimle(ham) {
  const r = String(ham || '').replace(/\D/g, '').slice(0, 11);
  if (!r) return '';
  const p = [r.slice(0, 4), r.slice(4, 7), r.slice(7, 9), r.slice(9, 11)];
  return p.filter(Boolean).join(' ');
}

/** Boş kabul edilir; doluysa 11 hane ve 0 ile başlamalı. */
function telefonGecerli(ham) {
  const r = String(ham || '').replace(/\D/g, '');
  return r === '' || (r.length === 11 && r.startsWith('0'));
}

function profilFormunuKur(user) {
  const form = kabuk.querySelector('#profilForm');
  if (!form) return;

  const telefonAlan = form.querySelector('#pf-telefon');
  const durum = kabuk.querySelector('[data-profil-durum]');
  const btn = form.querySelector('.kaydet-btn');

  // Kimlik kartı bölümü
  const foto = kabuk.querySelector('[data-profil-foto]');
  const ad = user.displayName || user.email || 'Hesabım';
  if (user.photoURL) {
    const img = document.createElement('img');
    img.src = user.photoURL; img.alt = ''; img.referrerPolicy = 'no-referrer';
    foto.appendChild(img);
  } else {
    foto.textContent = ad.trim().charAt(0).toUpperCase();
  }
  kabuk.querySelector('[data-profil-isim]').textContent = ad;
  kabuk.querySelector('[data-profil-alt]').textContent = user.email || '';
  form.querySelector('#pf-email').value = user.email || '';

  // Yazarken biçimlendir
  telefonAlan.addEventListener('input', () => {
    const konum = telefonAlan.selectionStart === telefonAlan.value.length;
    telefonAlan.value = telefonBicimle(telefonAlan.value);
    if (konum) telefonAlan.setSelectionRange(telefonAlan.value.length, telefonAlan.value.length);
    telefonAlan.closest('.alan').classList.remove('hatali');
  });

  // Kayıtlı veriyi yükle
  profiliGetir(user.uid).then(veri => {
    if (!veri) return;
    form.querySelector('#pf-ad').value = veri.ad || '';
    form.querySelector('#pf-soyad').value = veri.soyad || '';
    telefonAlan.value = telefonBicimle(veri.telefon || '');
    form.querySelector('#pf-tur').value = veri.ehliyetTuru || '';
  }).catch(err => {
    console.error('Profil okunamadı:', err);
    durum.textContent = 'Bilgiler yüklenemedi.';
    durum.className = 'form-durum hata';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    durum.textContent = ''; durum.className = 'form-durum';

    if (!telefonGecerli(telefonAlan.value)) {
      telefonAlan.closest('.alan').classList.add('hatali');
      telefonAlan.focus();
      return;
    }

    btn.disabled = true;
    const eskiMetin = btn.textContent;
    btn.textContent = 'Kaydediliyor…';
    try {
      await profiliKaydet(user.uid, {
        ad: form.querySelector('#pf-ad').value.trim(),
        soyad: form.querySelector('#pf-soyad').value.trim(),
        // Rakam olarak saklanır; biçimlendirme yalnızca görüntüde
        telefon: telefonAlan.value.replace(/\D/g, ''),
        ehliyetTuru: form.querySelector('#pf-tur').value,
      });
      durum.textContent = 'Kaydedildi.';
      durum.className = 'form-durum ok';
    } catch (err) {
      console.error('Profil kaydedilemedi:', err);
      durum.textContent = 'Kaydedilemedi, tekrar deneyin.';
      durum.className = 'form-durum hata';
    } finally {
      btn.disabled = false;
      btn.textContent = eskiMetin;
    }
  });
}

/** Kullanıcıya özel alanlar; oturum çözülünce doldurulur. */
function kullaniciyiYaz(user) {
  const avatar = kabuk.querySelector('[data-avatar]');
  if (!avatar || avatar.dataset.dolu) return;
  avatar.dataset.dolu = '1';

  const ad = user.displayName || user.email || 'Hesabım';
  kabuk.querySelector('[data-ad]').textContent = ad;

  if (user.photoURL) {
    const img = document.createElement('img');
    img.src = user.photoURL; img.alt = ''; img.referrerPolicy = 'no-referrer';
    avatar.appendChild(img);
  } else {
    avatar.textContent = ad.trim().charAt(0).toUpperCase();
  }

  // Sidebar profil bloğu
  const pkProfil = kabuk.querySelector('[data-pk-profil]');
  if (pkProfil) {
    pkProfil.hidden = false;
    kabuk.querySelector('[data-pk-ad]').textContent = ad;
    kabuk.querySelector('[data-pk-mail]').textContent = user.email || '';
    const pkAvatar = kabuk.querySelector('[data-pk-avatar]');
    if (user.photoURL) {
      const img2 = document.createElement('img');
      img2.src = user.photoURL; img2.alt = ''; img2.referrerPolicy = 'no-referrer';
      pkAvatar.appendChild(img2);
    } else {
      pkAvatar.textContent = ad.trim().charAt(0).toUpperCase();
    }
    const pkCikis = kabuk.querySelector('[data-pk-cikis]');
    if (pkCikis) {
      pkCikis.addEventListener('click', async () => {
        const { cikisOnayiAc } = await import('/assets/js/cikis-onay.js');
        cikisOnayiAc(async () => { await cikisYap(); location.href = '/'; });
      });
    }
  }

  // Ayarlar bölümünü doldur
  const ayarEmail = kabuk.querySelector('[data-ayar-email]');
  const ayarTarih = kabuk.querySelector('[data-ayar-tarih]');
  if (ayarEmail) ayarEmail.value = user.email || '';
  if (ayarTarih && user.metadata?.creationTime) {
    ayarTarih.value = new Date(user.metadata.creationTime).toLocaleDateString('tr-TR', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  // Hesap silme
  const silBtn = kabuk.querySelector('[data-hesap-sil]');
  const silModal = kabuk.querySelector('[data-sil-modal]');
  const silIptal = kabuk.querySelector('[data-sil-iptal]');
  const silOnayla = kabuk.querySelector('[data-sil-onayla]');
  const silDurum = kabuk.querySelector('[data-sil-durum]');

  if (silBtn && silModal) {
    silBtn.addEventListener('click', () => { silModal.hidden = false; });
    silIptal.addEventListener('click', () => { silModal.hidden = true; silDurum.textContent = ''; });
    silModal.addEventListener('click', (e) => { if (e.target === silModal) { silModal.hidden = true; silDurum.textContent = ''; } });

    silOnayla.addEventListener('click', async () => {
      silOnayla.disabled = true;
      silOnayla.textContent = 'Siliniyor…';
      silDurum.textContent = '';
      try {
        const { hesabiSil } = await import('/assets/js/firebase.js');
        await hesabiSil(user);
        location.replace('/');
      } catch (err) {
        console.error('Hesap silinemedi:', err);
        if (err.code === 'auth/requires-recent-login') {
          silDurum.textContent = 'Güvenlik nedeniyle yeniden giriş yapmanız gerekiyor. Çıkış yapıp tekrar girin.';
        } else {
          silDurum.textContent = 'Hesap silinemedi. Lütfen tekrar deneyin.';
        }
        silOnayla.disabled = false;
        silOnayla.textContent = 'Evet, Hesabımı Sil';
      }
    });
  }
}

// Önceki oturum biliniyorsa kabuğu Firebase'i beklemeden kur; aksi halde
// "Yükleniyor…" ekranı SDK inip oturum çözülene kadar ekranda kalıyor ve
// sınavdan panele dönüşte her seferinde görünüyor.
let kuruldu = false;
function kurBirKez() {
  if (kuruldu) return;
  kuruldu = true;
  kabuguKur();
}

if (oturumBekleniyorMu()) kurBirKez();

kullaniciDinle(async (user) => {
  if (!user) { location.replace('/'); return; }
  kurBirKez();
  kullaniciyiYaz(user);

  // Profil dokümanı formdan ÖNCE hazırlanmalı: ilk girişte doküman henüz yokken
  // form okuma yaparsa boş kalır ve kullanıcı bilgilerini silinmiş sanır.
  try {
    await profiliHazirla(user);
  } catch (err) {
    console.error('Profil hazırlanamadı:', err);
  }
  profilFormunuKur(user);
});
</script>
</body>
</html>
