<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Panel — ehliyet.digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--fg:#08090a;--muted:#6a6f76;--line:#ececec;--bg:#fff;--yan:248px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
  a{color:inherit;text-decoration:none}

  /* ---- Yan menü ---- */
  .yan{position:fixed;inset:0 auto 0 0;width:var(--yan);border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:#fff;z-index:30}
  .marka{display:flex;align-items:center;gap:10px;padding:20px 18px 22px}
  .marka img{width:26px;height:26px;object-fit:contain;flex-shrink:0}
  .marka span{font-size:15.5px;font-weight:600;letter-spacing:-.02em}

  .menu{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  .menu-alt{margin-top:auto;padding:0 12px 18px}
  .oge{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
    font-size:14px;font-weight:450;color:#3a3d42;cursor:pointer;background:none;border:none;
    font-family:inherit;width:100%;text-align:left;transition:.12s}
  .oge:hover{background:#f5f5f5;color:var(--fg)}
  .oge.aktif{background:#f2f2f2;color:var(--fg);font-weight:500}
  .oge svg{flex-shrink:0;color:currentColor}

  /* ---- Üst bar ---- */
  .ust{position:fixed;top:0;left:var(--yan);right:0;height:60px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(10px);z-index:20}
  .baslik{font-size:15px;font-weight:500;letter-spacing:-.015em}
  .ust-sag{margin-left:auto;display:flex;align-items:center;gap:10px}
  .kucuk-btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;
    font-size:13.5px;font-weight:450;line-height:1;padding:9px 15px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;transition:.12s}
  .kucuk-btn:hover{border-color:#c8c8c8;background:#fafafa}
  .profil-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f5f5f5;
    padding:0;cursor:pointer;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--fg);transition:.12s}
  .profil-btn:hover{border-color:#c8c8c8}
  .profil-btn img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---- İçerik ---- */
  main{margin-left:var(--yan);padding:60px 0 0}
  .icerik{padding:36px 24px 72px;max-width:1080px}

  .sec-basi{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.025em}
  .sec-alt{margin:0 0 30px;color:var(--muted);font-size:15px;line-height:1.55}

  .sinav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
  .sinav-kart{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;
    padding:22px;background:#fff;transition:.15s;min-height:250px}
  a.sinav-kart:hover{border-color:#d4d4d4;box-shadow:0 10px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
  .sinav-kart h3{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .sinav-kart .aciklama{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .sinav-kart ul{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:9px}
  .sinav-kart li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#3a3d42}
  .sinav-kart li svg{flex-shrink:0}
  .bosluk{flex:1}
  .kart-btn{display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;
    padding:10px 16px;border-radius:999px;background:#08090a;color:#fff;border:1px solid #08090a}
  .kart-btn.pasif{background:#fff;color:#aab0b6;border-color:var(--line);pointer-events:none}
  .sinav-kart.yakinda{opacity:.75}
  .sinav-kart.yakinda li{color:#aab0b6}
  .rozet{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;
    background:#eef7f0;color:#1a7f37;margin-left:8px;vertical-align:middle}

  /* ---- Yakında ekranı ---- */
  .yakinda-ekran{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;min-height:calc(100vh - 60px);padding:24px}
  .yakinda-ekran .halka{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--muted)}
  .yakinda-ekran h2{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .yakinda-ekran p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55;max-width:330px}

  .yukleniyor{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:15px}

  /* ---- Dar ekran ---- */
  @media(max-width:820px){
    :root{--yan:0px}
    .yan{position:static;width:100%;height:auto;flex-direction:row;align-items:center;
      border-right:none;border-bottom:1px solid var(--line);padding:0 14px;gap:6px;overflow-x:auto}
    .marka{padding:12px 8px 12px 0}
    .marka span{font-size:14.5px}
    .menu,.menu-alt{flex-direction:row;padding:0;margin-top:0}
    .oge{padding:8px 11px;font-size:13.5px;white-space:nowrap}
    .ust{position:static;left:0;height:54px;padding:0 14px}
    main{margin-left:0;padding-top:0}
    .icerik{padding:26px 16px 56px}
    .yakinda-ekran{min-height:52vh}
  }
</style>
</head>
<body>

<div id="kabuk" class="yukleniyor">Yükleniyor…</div>

<template id="sablon">
  <aside class="yan">
    <div class="marka">
      <img src="/assets/img/marka/logo.png" alt="">
      <span>ehliyet.digital</span>
    </div>

    <nav class="menu">
      <button class="oge aktif" type="button" data-gorunum="sinavlar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        Deneme Sınavları
      </button>
    </nav>

    <nav class="menu-alt">
      <button class="oge" type="button" data-gorunum="ayarlar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
    </nav>
  </aside>

  <div class="ust">
    <span class="baslik" data-baslik>Deneme Sınavları</span>
    <div class="ust-sag">
      <a class="kucuk-btn" href="mailto:omerlhn@gmail.com?subject=ehliyet.digital%20—%20Geri%20Bildirim">Feedback</a>
      <button class="profil-btn" type="button" data-profil aria-label="Profil"></button>
    </div>
  </div>

  <main>
    <!-- Deneme sınavları -->
    <section class="icerik" data-gorunum-icerik="sinavlar">
      <h1 class="sec-basi">Deneme Sınavları</h1>
      <p class="sec-alt">Gerçek MTSK e-sınav formatında, 50 soruluk tam deneme sınavları.</p>

      <div class="sinav-grid">
        <a class="sinav-kart" href="/deneme-sinavlari/sinav-1/kilavuz/">
          <h3>Sınav 1<span class="rozet">Ücretsiz</span></h3>
          <p class="aciklama">Tüm bölümleri kapsayan tam deneme sınavı.</p>
          <ul>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>50 soru</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>45 dakika süre</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>4 bölüm</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Çözümlü cevap anahtarı</li>
          </ul>
          <div class="bosluk"></div>
          <span class="kart-btn">Sınavı Başlat</span>
        </a>

        <a class="sinav-kart" href="/deneme-sinavlari/sinav-2/kilavuz/">
          <h3>Sınav 2</h3>
          <p class="aciklama">Tüm bölümleri kapsayan tam deneme sınavı.</p>
          <ul>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>50 soru</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>45 dakika süre</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>4 bölüm</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Çözümlü cevap anahtarı</li>
          </ul>
          <div class="bosluk"></div>
          <span class="kart-btn">Sınavı Başlat</span>
        </a>

        <div class="sinav-kart yakinda">
          <h3>Sınav 3</h3>
          <p class="aciklama">Çok yakında eklenecek.</p>
          <ul>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>50 soru</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>45 dakika süre</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>4 bölüm</li>
          </ul>
          <div class="bosluk"></div>
          <span class="kart-btn pasif">Yakında</span>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section data-gorunum-icerik="ayarlar" hidden>
      <div class="yakinda-ekran">
        <div class="halka">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <h2>Yakında geliştirilecek</h2>
        <p>Bu alan üzerinde çalışıyoruz. Kısa süre içinde tekrar göz atın.</p>
      </div>
    </section>

    <!-- Profil -->
    <section data-gorunum-icerik="profil" hidden>
      <div class="yakinda-ekran">
        <div class="halka">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <h2>Yakında geliştirilecek</h2>
        <p>Bu alan üzerinde çalışıyoruz. Kısa süre içinde tekrar göz atın.</p>
      </div>
    </section>
  </main>
</template>

<script type="module">
import { kullaniciDinle, profiliHazirla } from '/assets/js/firebase.js';

const kabuk = document.getElementById('kabuk');
const BASLIKLAR = { sinavlar: 'Deneme Sınavları', ayarlar: 'Settings', profil: 'Profil' };

function kabuguKur(user) {
  kabuk.classList.remove('yukleniyor');
  kabuk.textContent = '';
  kabuk.appendChild(document.getElementById('sablon').content.cloneNode(true));

  const baslik = kabuk.querySelector('[data-baslik]');
  const ogeler = [...kabuk.querySelectorAll('.oge[data-gorunum]')];
  const bolumler = [...kabuk.querySelectorAll('[data-gorunum-icerik]')];

  function goster(ad) {
    bolumler.forEach(b => { b.hidden = b.dataset.gorunumIcerik !== ad; });
    ogeler.forEach(o => o.classList.toggle('aktif', o.dataset.gorunum === ad));
    baslik.textContent = BASLIKLAR[ad] || '';
  }

  ogeler.forEach(o => o.addEventListener('click', () => goster(o.dataset.gorunum)));

  // Profil butonu: şimdilik "yakında" ekranını açar, menüdeki hiçbir öğe seçili kalmaz.
  const profilBtn = kabuk.querySelector('[data-profil]');
  profilBtn.addEventListener('click', () => goster('profil'));

  if (user.photoURL) {
    const img = document.createElement('img');
    img.src = user.photoURL;
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    profilBtn.appendChild(img);
  } else {
    profilBtn.textContent = (user.displayName || user.email || '?').trim().charAt(0).toUpperCase();
  }
}

kullaniciDinle(async (user) => {
  if (!user) {
    // Panel yalnızca giriş yapmış kullanıcılar içindir.
    location.replace('/');
    return;
  }
  kabuguKur(user);
  try {
    await profiliHazirla(user);
  } catch (err) {
    console.error('Profil kaydedilemedi:', err);
  }
});
</script>
</body>
</html>
