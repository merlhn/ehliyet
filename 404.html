<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<meta name="robots" content="noindex">
<title>Sayfa Bulunamadı — ehliyet.digital</title>
<style>
  :root{--fg:#08090a;--muted:#6a6f76;--line:#ececec}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit}
  header{display:flex;align-items:center;gap:26px;height:64px;padding:0 max(28px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(10px);z-index:20}
  .nav{display:flex;gap:24px}
  .nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:450;white-space:nowrap}
  .nav a:hover{color:#08090a}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center}
  h1{font-size:72px;font-weight:700;margin:0 0 8px;letter-spacing:-.03em}
  p{color:var(--muted);font-size:17px;line-height:1.7;margin:0 0 32px;max-width:440px}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .links a{display:inline-block;padding:10px 20px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;transition:border-color .15s}
  .links a:hover{border-color:#08090a}
  @media(max-width:720px){header{padding:0 16px;gap:12px;height:58px}h1{font-size:56px}}
</style>
<style id="ust-banner-css">.ust-banner{display:flex;align-items:center;justify-content:center;gap:10px;min-height:40px;padding:8px 16px;background:#08090a;color:#fff;font-size:13.5px;line-height:1.35;text-decoration:none;text-align:center}.ust-banner:hover b{text-decoration:underline}.ust-banner-rozet{background:#16a34a;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;letter-spacing:.02em;flex-shrink:0}.ust-banner b{font-weight:600;white-space:nowrap}.ust-banner-kisa{display:none}@media(max-width:640px){.ust-banner{font-size:12.5px;gap:8px;padding:8px 12px}.ust-banner-uzun{display:none}.ust-banner-kisa{display:inline}}</style>
</head>
<body>
<!-- ust-banner -->
<a class="ust-banner" href="/deneme-sinavi/?basla=1" onclick="typeof gtag==='function'&&gtag('event','banner_click',{sayfa:location.pathname})"><span class="ust-banner-rozet">Ücretsiz</span><span class="ust-banner-uzun">Ehliyet deneme sınavı: 50 soru, 45 dakika, gerçek sınav formatı.</span><span class="ust-banner-kisa">50 soruluk deneme sınavı.</span><b>Hemen çöz →</b></a>
<!-- /ust-banner -->
<header>
  <a href="/" aria-label="ehliyet.digital" style="font-weight:700;text-decoration:none;font-size:15px">ehliyet.digital</a>
  <nav class="nav" aria-label="Ana navigasyon">
    <a href="/">Ana Sayfa</a>
    <a href="/ehliyet-sinav-sorulari/">Soru Çöz</a>
    <a href="/dersler/">Ders Notları</a>
    <a href="/hap-bilgiler/">Hap Bilgiler</a>
  </nav>
</header>
<main>
  <h1>404</h1>
  <p>Aradığın sayfa bulunamadı. Taşınmış veya kaldırılmış olabilir.</p>
  <div class="links">
    <a href="/">Ana Sayfa</a>
    <a href="/dersler/">Ders Notları</a>
    <a href="/ehliyet-sinav-sorulari/">Soru Çöz</a>
    <a href="/hap-bilgiler/">Hap Bilgiler</a>
  </div>
</main>
<script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
